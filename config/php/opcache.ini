; The application code is baked into the image and cannot change at runtime, so
; opcache never needs to stat files for changes. This is the single biggest
; cheap win for WordPress response times.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.enable_file_override = 0
