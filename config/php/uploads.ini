; The existing media library averages 1.75MB per original and peaks above 5MB,
; so the stock 2MB upload limit would reject most of it.
upload_max_filesize = 32M
post_max_size = 40M
max_file_uploads = 40

; Regenerating thumbnails for a large JPEG is the most memory-hungry thing this
; site does; 256M leaves headroom without inviting a runaway process.
memory_limit = 256M
max_execution_time = 180
max_input_time = 180

; Errors go to the container log, never to the browser.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off
