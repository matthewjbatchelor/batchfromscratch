name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none

      - name: PHP syntax check
        run: |
          find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Shell syntax check
        run: |
          for f in docker/entrypoint.sh scripts/*.sh; do bash -n "$f"; done

      # wp-config-extra.php runs before WordPress exists and before ABSPATH is
      # defined. Getting it wrong fatals every request with no useful message, so
      # its behaviour is asserted rather than assumed.
      - name: wp-config behaviour
        run: php scripts/test-wp-config.php

      # Errors only. Style warnings on a handful of deploy scripts are not worth a
      # red build, and a CI check that cries wolf is a CI check people stop reading.
      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: error

  build:
    name: Build and boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: batchfromscratch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Surfaces the version the rolling tag resolved to, so it can be pinned in the
      # Dockerfile. See the ARG comment at the top of the Dockerfile.
      - name: Report the resolved WordPress and PHP versions
        run: |
          echo "Built from:"
          # The unanchored grep this used to run matched the docblock line
          # "* @global string $wp_version" and never printed a version at all, which
          # is a large part of why the base image stayed on a rolling tag.
          docker run --rm --entrypoint sh batchfromscratch:ci -c \
            'php -r "echo \"PHP \" . PHP_VERSION . PHP_EOL;"; \
             grep -m1 "^\$wp_version = " /usr/src/wordpress/wp-includes/version.php'
          # Exactly one MPM must be loaded — two makes Apache exit at startup, which
          # surfaces as a refused connection rather than an HTTP error.
          mpms=$(docker run --rm --entrypoint sh batchfromscratch:ci -c \
            'ls /etc/apache2/mods-enabled/mpm_*.load' | wc -l | tr -d ' ')
          docker run --rm --entrypoint sh batchfromscratch:ci -c \
            'ls /etc/apache2/mods-enabled/mpm_*.load'
          if [ "$mpms" != "1" ]; then
            echo "::error::$mpms MPMs enabled — Apache will refuse to start"
            exit 1
          fi

      # Railway ran an image carrying two MPMs whose build passed `apache2ctl
      # configtest`, so configtest is not a reliable guard for this. The Dockerfile
      # counts the symlinks instead; this records whether configtest detects it at
      # all, so nobody re-adds it as the assertion on the strength of the name.
      - name: Does configtest detect a second MPM?
        run: |
          out=$(docker run --rm --entrypoint sh batchfromscratch:ci -c \
            'a2enmod mpm_event >/dev/null 2>&1; apache2ctl configtest 2>&1' || true)
          echo "$out"
          if echo "$out" | grep -q AH00534; then
            echo "configtest DOES detect a second MPM"
          else
            echo "::warning::apache2ctl configtest does NOT detect a second MPM — the symlink count is the only real guard"
          fi

      # A green Docker build proves the Dockerfile parses, not that the site runs.
      # Booting it against a real MySQL is what catches an Apache directive typo,
      # a bad wp-config heredoc, or an entrypoint that exits before Apache starts.
      - name: Start MySQL
        run: |
          docker network create ci
          docker run -d --name db --network ci \
            -e MYSQL_DATABASE=wordpress \
            -e MYSQL_USER=wordpress \
            -e MYSQL_PASSWORD=wordpress \
            -e MYSQL_ROOT_PASSWORD=root \
            mysql:8.0
          for i in $(seq 1 60); do
            docker exec db mysqladmin ping -h127.0.0.1 -uroot -proot --silent && break
            sleep 2
          done

      - name: Boot the container
        run: |
          docker run -d --name web --network ci -p 8080:8080 \
            -e PORT=8080 \
            -e MYSQLHOST=db -e MYSQLPORT=3306 \
            -e MYSQLUSER=wordpress -e MYSQLPASSWORD=wordpress -e MYSQLDATABASE=wordpress \
            -e WP_HOME=http://localhost:8080 -e WP_SITEURL=http://localhost:8080 \
            batchfromscratch:ci

      - name: Wait for the health endpoint
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/healthz.php | grep -q '^ok$'; then
              echo "health check passed"; exit 0
            fi
            sleep 2
          done
          echo "::error::container never became healthy"
          docker logs web
          exit 1

      - name: WordPress responds
        run: |
          # A fresh database means WordPress redirects to the install wizard.
          # That is the expected healthy answer here: it proves PHP ran, the
          # database connection succeeded, and Apache is serving WordPress
          # rather than a 500.
          body=$(curl -fsSL http://localhost:8080/ || true)
          echo "$body" | head -40
          echo "$body" | grep -qiE 'wordpress|installation' || {
            echo "::error::unexpected response from WordPress"
            docker logs web
            exit 1
          }

      - name: Theme is present and recognised
        run: |
          docker exec -u www-data web wp --path=/var/www/html theme list --format=csv || true
          docker exec web test -f /var/www/html/wp-content/themes/batchfromscratch/style.css

      - name: Uploads directory must not execute PHP
        run: |
          docker exec web sh -c 'mkdir -p /var/www/html/wp-content/uploads && echo "<?php echo 9*9;" > /var/www/html/wp-content/uploads/probe.php'
          code=$(curl -s -o /tmp/out -w '%{http_code}' http://localhost:8080/wp-content/uploads/probe.php)
          echo "status=$code"; cat /tmp/out
          if [ "$code" != "403" ]; then
            echo "::error::uploads directory served PHP (status $code) — the Apache guard is not working"
            exit 1
          fi

      # Every step above boots the image the way `docker run` does — ENTRYPOINT plus
      # CMD, no override. Railway does not: a start command set in railway.json or in
      # the dashboard arrives shell-wrapped as `/bin/sh -c apache2-foreground`, and
      # the upstream entrypoint only performs its setup when $1 begins with "apache2".
      # That mismatch left the document root empty and failed Railway's health check
      # while CI stayed green, so the wrapped form is now booted here as well.
      - name: Boot the way Railway does (shell-wrapped start command)
        run: |
          docker run -d --name web-wrapped --network ci -p 8081:8081 \
            -e PORT=8081 \
            -e MYSQLHOST=db -e MYSQLPORT=3306 \
            -e MYSQLUSER=wordpress -e MYSQLPASSWORD=wordpress -e MYSQLDATABASE=wordpress \
            -e WP_HOME=http://localhost:8081 -e WP_SITEURL=http://localhost:8081 \
            batchfromscratch:ci /bin/sh -c apache2-foreground
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8081/healthz.php | grep -q '^ok$'; then
              echo "health check passed"; break
            fi
            sleep 2
            if [ "$i" = 45 ]; then
              echo "::error::shell-wrapped boot never became healthy"
              docker logs web-wrapped
              exit 1
            fi
          done
          # The health endpoint alone would pass even if WordPress were never
          # installed — it is served by Apache regardless. Assert the setup the
          # wrapper used to skip actually ran.
          docker exec web-wrapped test -f /var/www/html/index.php
          docker exec web-wrapped test -f /var/www/html/wp-config.php

      - name: Apache starts without the AH00558 warning
        run: |
          if docker logs web 2>&1 | grep -q AH00558; then
            echo "::error::ServerName is not silencing AH00558"
            docker logs web 2>&1 | grep AH00558
            exit 1
          fi
          echo "no AH00558"

      # A missing volume is silent until the day it costs you a media library, so the
      # entrypoint reports which state it is in. Both directions are checked: the
      # warning is only useful if it is absent when a volume really is mounted.
      - name: wp-content volume detection reports both states
        run: |
          docker logs web 2>&1 | grep -q "NOT a mount point" || {
            echo "::error::unmounted wp-content did not produce a warning"
            docker logs web 2>&1 | grep -i wp-content || true
            exit 1
          }
          docker volume create wpc >/dev/null
          docker run -d --name web-vol --network ci -p 8082:8082 -e PORT=8082 \
            -v wpc:/var/www/html/wp-content batchfromscratch:ci >/dev/null
          for i in $(seq 1 30); do
            docker logs web-vol 2>&1 | grep -q "wp-content: volume mounted" && break
            sleep 1
          done
          docker logs web-vol 2>&1 | grep -q "wp-content: volume mounted" || {
            echo "::error::a mounted volume was not detected"
            docker logs web-vol
            exit 1
          }
          echo "both states reported correctly"

      - name: Container logs
        if: always()
        run: |
          docker logs web || true
          docker logs web-wrapped || true
          docker logs web-vol || true
